name: Repository validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and compile Arduino Uno
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Read pinned toolchain
        id: toolchain
        run: |
          python - <<'PY'
          import json
          import os

          with open("config/toolchain.json", encoding="utf-8") as handle:
              toolchain = json.load(handle)

          version = toolchain["arduino_cli"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"arduino_cli={version}\n")
          PY

      - name: Install pinned Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ steps.toolchain.outputs.arduino_cli }}

      - name: Show tool versions
        run: |
          python --version
          arduino-cli version

      - name: Check generated project configuration
        run: python tools/generate_project_config.py --check

      - name: Check generated AVR contracts
        run: python tools/generate_avr_contracts.py --check

      - name: Check generated library list
        run: python tools/generate_libraries.py --check

      - name: Check generated documentation
        run: python tools/generate_docs.py --check

      - name: Run automated host tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate repository consistency
        run: python tools/validate_repository.py

      - name: Compile integrated Arduino Uno firmware
        env:
          ARDUINO_UPDATER_ENABLE_NOTIFICATION: "false"
        run: python tools/build_firmware.py
